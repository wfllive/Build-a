name: Build Android from ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'project.zip'
      - 'build-target.txt'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check uploaded files
        shell: bash
        run: |
          test -f project.zip || (echo "project.zip not found" && exit 1)
          test -f build-target.txt || (echo "build-target.txt not found" && exit 1)

      - name: Read build target
        id: target
        shell: bash
        run: |
          TARGET=$(tr -d '\r\n[:space:]' < build-target.txt)

          case "$TARGET" in
            debug|release|aab) ;;
            *)
              echo "Invalid target: $TARGET"
              echo "Allowed: debug | release | aab"
              exit 1
              ;;
          esac

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Selected target: $TARGET"

      - name: Unzip project
        shell: bash
        run: |
          rm -rf project
          mkdir project
          unzip -q project.zip -d project

          cd project

          ITEMS=$(find . -mindepth 1 -maxdepth 1 | wc -l)
          DIRS=$(find . -mindepth 1 -maxdepth 1 -type d | wc -l)

          # Если в архиве один корневой каталог (и это НЕ 'android') —
          # «поднимаем» его содержимое наверх, чтобы android/ оказался в project/android
          if [ "$ITEMS" -eq 1 ] && [ "$DIRS" -eq 1 ]; then
            INNER_DIR=$(find . -mindepth 1 -maxdepth 1 -type d | head -n 1)
            INNER_NAME=$(basename "$INNER_DIR")
            if [ "$INNER_NAME" != "android" ]; then
              echo "Flattening wrapper directory: $INNER_NAME"
              shopt -s dotglob
              mv "$INNER_DIR"/* . 2>/dev/null || true
              mv "$INNER_DIR"/.[!.]* . 2>/dev/null || true
              rm -rf "$INNER_DIR"
            fi
          fi

          echo "Project root:"
          ls -la

      - name: Locate android directory
        id: locate
        shell: bash
        run: |
          # Ищем android/ — сначала в project/android, потом на 1 уровень глубже
          if [ -d project/android ]; then
            ANDROID_DIR="project/android"
          else
            FOUND=$(find project -maxdepth 3 -type d -name android | head -n 1)
            if [ -n "$FOUND" ]; then
              ANDROID_DIR="$FOUND"
            else
              echo "ERROR: 'android' folder not found inside project.zip"
              find project -maxdepth 3 -type d | head -n 50
              exit 1
            fi
          fi

          # Проверяем, что это Gradle-проект
          if [ ! -f "$ANDROID_DIR/gradlew" ] \
             && [ ! -f "$ANDROID_DIR/settings.gradle" ] \
             && [ ! -f "$ANDROID_DIR/settings.gradle.kts" ] \
             && [ ! -f "$ANDROID_DIR/build.gradle" ] \
             && [ ! -f "$ANDROID_DIR/build.gradle.kts" ]; then
            echo "ERROR: '$ANDROID_DIR' is not a Gradle project (no gradlew/settings.gradle/build.gradle)"
            ls -la "$ANDROID_DIR"
            exit 1
          fi

          echo "Android dir: $ANDROID_DIR"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          ls -la "$ANDROID_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew is executable
        working-directory: ${{ steps.locate.outputs.android_dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew not found — will use system gradle"
          fi

      # ─────────────────────────────────────────────
      # Сборка
      # ─────────────────────────────────────────────
      - name: Build APK Debug
        if: steps.target.outputs.target == 'debug'
        working-directory: ${{ steps.locate.outputs.android_dir }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRustoreDebug --no-daemon --stacktrace
          else
            gradle assembleRustoreDebug --no-daemon --stacktrace
          fi

      - name: Build APK Release
        if: steps.target.outputs.target == 'release'
        working-directory: ${{ steps.locate.outputs.android_dir }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRustoreRelease --no-daemon --stacktrace
          else
            gradle assembleRustoreRelease --no-daemon --stacktrace
          fi

      - name: Build AAB Release
        if: steps.target.outputs.target == 'aab'
        working-directory: ${{ steps.locate.outputs.android_dir }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew bundleRelease --no-daemon --stacktrace
          else
            gradle bundleRelease --no-daemon --stacktrace
          fi

      # ─────────────────────────────────────────────
      # Диагностика: показываем, что реально сгенерировалось
      # ─────────────────────────────────────────────
      - name: List build outputs
        if: always()
        working-directory: ${{ steps.locate.outputs.android_dir }}
        shell: bash
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" 2>/dev/null || true
          echo ""
          echo "=== AAB files ==="
          find . -type f -name "*.aab" 2>/dev/null || true
          echo ""
          echo "=== build/outputs tree ==="
          find . -type d -path "*/build/outputs*" 2>/dev/null || true

      # ─────────────────────────────────────────────
      # Загрузка артефактов
      # ─────────────────────────────────────────────
      - name: Upload APK Debug
        if: steps.target.outputs.target == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: |
            ${{ steps.locate.outputs.android_dir }}/**/build/outputs/apk/**/*.apk
            ${{ steps.locate.outputs.android_dir }}/**/build/outputs/**/*-debug*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload APK Release
        if: steps.target.outputs.target == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: |
            ${{ steps.locate.outputs.android_dir }}/**/build/outputs/apk/**/*.apk
            ${{ steps.locate.outputs.android_dir }}/**/build/outputs/**/*-release*.apk
            ${{ steps.locate.outputs.android_dir }}/**/build/outputs/**/*-unsigned*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload AAB Release
        if: steps.target.outputs.target == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: |
            ${{ steps.locate.outputs.android_dir }}/**/build/outputs/bundle/**/*.aab
            ${{ steps.locate.outputs.android_dir }}/**/build/outputs/**/*.aab
          retention-days: 14
          if-no-files-found: error

      # ─────────────────────────────────────────────
      # Очистка
      # ─────────────────────────────────────────────
      - name: Cleanup runner
        if: always()
        run: |
          rm -rf project

      - name: Remove uploaded files from repository
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f project.zip || true
          git rm -f build-target.txt || true
          git commit -m "cleanup: remove uploaded files [skip ci]" || echo "nothing to commit"
          git push || echo "nothing to push"
